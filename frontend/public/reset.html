<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reset Cache - AYPSIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .status-list {
      background: #0d131f;
      border-radius: 12px;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.85rem;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #cbd5e1;
    }
    .status-icon {
      font-size: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #0284c7;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="spinner">⚙️</div>
    <h1 id="title">Membersihkan Cache HP</h1>
    <p id="desc">Sedang menghapus cache &amp; update rusak agar aplikasi normal kembali...</p>

    <div class="status-list">
      <div class="status-item" id="step1"><span class="status-icon">⏳</span> Hapus Cache Browser</div>
      <div class="status-item" id="step2"><span class="status-icon">⏳</span> Reset Service Worker</div>
      <div class="status-item" id="step3"><span class="status-icon">⏳</span> Memuat Ulang Aplikasi</div>
    </div>

    <button class="btn" id="actionBtn" onclick="runReset()" style="display:none;">Coba Lagi</button>
  </div>

  <script>
    async function runReset() {
      const s1 = document.getElementById('step1');
      const s2 = document.getElementById('step2');
      const s3 = document.getElementById('step3');
      const spinner = document.getElementById('spinner');
      const title = document.getElementById('title');
      const desc = document.getElementById('desc');

      try {
        // Step 1: Hapus semua cache storage
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name)));
        }
        s1.innerHTML = '<span class="status-icon">✅</span> Hapus Cache Browser';

        // Step 2: Unregister semua service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(r => r.unregister()));
        }
        s2.innerHTML = '<span class="status-icon">✅</span> Reset Service Worker';

        // Step 3: Selesai
        s3.innerHTML = '<span class="status-icon">✅</span> Memuat Ulang Aplikasi';
        spinner.innerHTML = '🎉';
        spinner.style.animation = 'none';
        title.innerText = 'Berhasil Dibersihkan!';
        desc.innerText = 'Mengalihkan ke aplikasi AYPSIS...';

        setTimeout(() => {
          window.location.replace('/?cleared=' + Date.now());
        }, 800);
      } catch (err) {
        console.error(err);
        s3.innerHTML = '<span class="status-icon">⚠️</span> Terjadi kendala: ' + err.message;
        document.getElementById('actionBtn').style.display = 'block';
      }
    }

    // Jalankan otomatis begitu halaman dibuka
    runReset();
  </script>
</body>
</html>
